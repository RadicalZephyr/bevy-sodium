[package]
name = "bevy-sodium"
version = "0.1.0"
edition = "2024"
authors = ["Zefira Shannon <zefira@hey.com>"]
license = "MIT OR Apache-2.0"
description = "A conceptual port of the Sodium functional reactive programming library to Bevy, with the FRP dependency graph modelled as ECS entities and relationships"
repository = "https://github.com/RadicalZephyr/bevy-sodium"
readme = "README.md"
keywords = ["frp", "reactive", "bevy", "ecs", "sodium"]
categories = ["game-development", "asynchronous"]
rust-version = "1.95.0"

[workspace]
members = ["docs/decisions/experiments"]

[dependencies]
bevy = { version = "0.19.1", default-features = false }
